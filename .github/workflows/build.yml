name: Build Bro Liker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${KEYSTORE_BASE64:-}" ] || { echo "KEYSTORE_BASE64 is missing."; exit 1; }
          export KEYSTORE_BASE64
          python3 - <<'PY'
          import base64, os, re, sys
          from pathlib import Path
          raw = os.environ.get("KEYSTORE_BASE64", "")
          raw = re.sub(r"-----BEGIN CERTIFICATE-----", "", raw, flags=re.I)
          raw = re.sub(r"-----END CERTIFICATE-----", "", raw, flags=re.I)
          raw = re.sub(r"\s+", "", raw)
          try:
              data = base64.b64decode(raw, validate=True)
          except Exception as exc:
              print(f"KEYSTORE_BASE64 invalid: {exc}")
              sys.exit(1)
          Path("release-key.jks").write_bytes(data)
          print(f"Release keystore restored ({len(data)} bytes).")
          PY
          test -s release-key.jks

      - name: Set release version code
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building versionCode=$VERSION_CODE"

      - name: Validate release signing credentials
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${KEYSTORE_PASSWORD:-}" ] || { echo "KEYSTORE_PASSWORD is missing."; exit 1; }
          [ -n "${KEY_ALIAS:-}" ] || { echo "KEY_ALIAS is missing."; exit 1; }
          [ -n "${KEY_PASSWORD:-}" ] || { echo "KEY_PASSWORD is missing."; exit 1; }
          [ "$KEYSTORE_PASSWORD" = "$KEY_PASSWORD" ] || { echo "ERROR: KEYSTORE_PASSWORD and KEY_PASSWORD must be the SAME for this clean setup."; exit 1; }
          keytool -list -v -keystore release-key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null
          echo "Release keystore, alias, store password and key password validated successfully."

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: bro-liker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean release keystore
        if: always()
        run: rm -f release-key.jks
